name: Backend mutation test check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
jobs:
  analize_backend:
    name: Backend
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build proto
        working-directory: ./code/api-proto
        run: mvn clean install
      - name: Build parent
        working-directory: ./code
        run: mvn -N install
      - name: Sonarcloud scan
        working-directory: ./code/gms-backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn clean test -Pmutation-test
      - name: Publish PIT results to GitHub Summary
        if: always()
        working-directory: ./code/gms-backend
        run: |
          echo "## 🧬 PIT Mutation Test Results" >> "$GITHUB_STEP_SUMMARY"
          REPORT=$(find target/pit-reports -name "mutations.xml" | head -1)
       
          if [ -z "$REPORT" ]; then
            echo "❌ PIT report not found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
       
          TOTAL=$(grep -o 'detected="[^"]*"' "$REPORT" | wc -l)
          KILLED=$(grep -o 'status="KILLED"' "$REPORT" | wc -l)
          SURVIVED=$(grep -o 'status="SURVIVED"' "$REPORT" | wc -l)
      
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total mutations | $TOTAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Killed | $KILLED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Survived | $SURVIVED |" >> "$GITHUB_STEP_SUMMARY"
